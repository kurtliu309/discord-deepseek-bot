# llmcord config template (schema: llmcord @ a99de6da1639f36972e6f57a4331e8d8b63b74bb).
#
# entrypoint.py loads this file, fills in the values marked "(env)" below and
# writes the final config.yaml at container start. Do NOT put secrets here.
#
# Secrets stay as "*_env" references: llmcord itself resolves any key ending
# in "_env" from the environment at runtime (see resolve_env() in llmcord.py),
# so the token / API key never touch the disk.

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: ""            # (env) STATUS_MESSAGE

max_text: 100000
max_images: 0                 # stage 1: text chat only (DeepSeek chat models are not vision models)
max_messages: 12               # keep the context (and DeepSeek cost) small

use_plain_responses: false    # (env) USE_PLAIN_RESPONSES
allow_dms: false              # (env) ALLOW_DMS

permissions:
  users:
    admin_ids: []             # (env) ADMIN_USER_IDS. Empty = nobody can use /model to switch models
    allowed_ids: []           # (env) ALLOWED_USER_IDS
    blocked_ids: []
  roles:
    allowed_ids: []
    blocked_ids: []
  channels:
    allowed_ids: []           # (env) ALLOWED_CHANNEL_IDS
    blocked_ids: []

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY

# Replaced by entrypoint.py with exactly one entry: "deepseek/<DEEPSEEK_MODEL>".
# Stage 1 is chat only: entrypoint.py refuses to start if any model entry
# carries "tools" / "tool_choice" / "functions" parameters.
models:
  deepseek/deepseek-flash:

system_prompt: ""             # (env) SYSTEM_PROMPT, else SYSTEM_PROMPT_FILE, else prompts/default.txt
