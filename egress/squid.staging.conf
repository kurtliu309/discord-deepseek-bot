# Squid egress proxy for the discord-deepseek-bot STAGING stack (172.31.0.0/24).
# Identical to squid.conf except the client addresses, which match docker-compose.staging.yml.
# Policy: only CONNECT to port 443; bot/scheduler only to domains in allowlist.txt, the keyless
# fetcher to any public host;
# never to private / loopback / link-local / CGNAT / multicast / reserved IPs (checked AFTER DNS).

http_port 3128

# ---- ACLs ----
acl SSL_ports port 443
acl CONNECT method CONNECT
acl allowed_domains dstdomain "/etc/squid/allowlist.txt"

# Clients, by fixed address on botnet (docker-compose.staging.yml pins them):
#  - keyed_clients (bot, scheduler) hold the Discord token + DeepSeek key: allowlist only.
#  - fetcher holds NO secrets: may reach any PUBLIC host on 443 (blocked_dst still applies).
acl keyed_clients src 172.31.0.10 172.31.0.11
acl fetcher_client src 172.31.0.20

acl blocked_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16
acl blocked_dst dst 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16
acl blocked_dst dst 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4
acl blocked_dst dst ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 100::/64 2001:db8::/32
acl blocked_dst dst fc00::/7 fe80::/10 fec0::/10 ff00::/8

# ---- Rules (first match wins) ----
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny to_localhost
http_access deny to_linklocal
http_access deny blocked_dst
http_access allow keyed_clients allowed_domains
http_access allow fetcher_client
http_access deny all

# Never act as a cache; no disk state.
cache deny all
cache_mem 8 MB
# Docker Desktop (WSL2) sets nofile ~1M; Squid sizes its FD tables from it and blows the 128m limit.
max_filedescriptors 1024
memory_cache_shared off

# Hide client details from upstream.
forwarded_for delete
via off

# Runs as non-root with a read-only root fs: everything writable lives in /tmp (tmpfs).
pid_filename /tmp/squid.pid
coredump_dir /tmp
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
cache_store_log none
logfile_rotate 0
shutdown_lifetime 3 seconds
pinger_enable off
