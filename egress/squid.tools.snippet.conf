# ---- tools / searxng (keyless) -------------------------------------------------------
# Snippet, not a complete config. Paste these two lines into egress/squid.conf:
#   1. the `acl` line next to `acl fetcher_client ...`
#   2. the `http_access allow tools_client` line AFTER `http_access allow fetcher_client`
#      and BEFORE `http_access deny all` (first match wins).
# Both clients hold no secrets, so they get the fetcher's rule: any public host on port 443.
# `blocked_dst` still applies (private / loopback / link-local / CGNAT are checked after DNS),
# and only CONNECT to 443 is allowed at all.
#
#   172.30.0.21 = tools   (MCP server: search, read_page, read_video)
#   172.30.0.22 = searxng (search engines)
#
# After merging: docker compose up -d --build egress

acl tools_client src 172.30.0.21 172.30.0.22
http_access allow tools_client
