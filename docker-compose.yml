# Discord <-> DeepSeek chat bot (v3, see docs/notes/design-v3.md).
#
#   bot, scheduler (hold secrets) --botnet--> egress (Squid) --egress_net--> Discord + api.deepseek.com only
#   fetcher (NO secrets)          --botnet--> egress (Squid) --egress_net--> any public host (443)
#   tools, searxng (NO secrets)   --botnet--> egress (Squid) --egress_net--> any public host (443)
#   bot, scheduler --botnet--> fetcher:8080 (URLs, files, RSS -> plain text)
#   bot --botnet--> tools:8090/mcp (read-only model tools) --botnet--> searxng:8080 (JSON search API)
#
# Isolation rules (do not relax): no ports, no docker socket, not privileged, non-root,
# read-only root fs, all capabilities dropped, everything on `botnet` only (egress also on
# egress_net). Mounts (v3, Kurt approved 2026-11-14): scheduler gets ./data -> /data (rw);
# bot gets ./data/guilds -> /data/guilds (rw, /setup writes configs) and
# ./data/shared -> /data/shared (ro, persona library + news material); searxng gets
# ./searxng/settings.yml (ro). Nothing else.
# Addresses on botnet are pinned because egress/squid.conf applies rules per source address.

name: discord-deepseek-bot

x-hardening: &hardening
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  privileged: false
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-proxy-env: &proxy-env
  HTTPS_PROXY: http://egress:3128
  HTTP_PROXY: http://egress:3128
  https_proxy: http://egress:3128
  http_proxy: http://egress:3128
  # fetcher and tools live on botnet: their traffic must never go through the egress proxy.
  NO_PROXY: fetcher,172.30.0.21
  no_proxy: fetcher,172.30.0.21

x-no-host-names: &no-host-names
  # Belt and braces: Docker Desktop host names resolve to the container's own loopback.
  - "host.docker.internal:127.0.0.1"
  - "gateway.docker.internal:127.0.0.1"
  - "kubernetes.docker.internal:127.0.0.1"

services:
  egress:
    <<: *hardening
    build:
      context: ./egress
      dockerfile: Dockerfile
    image: discord-deepseek-bot-egress:local
    container_name: discord-deepseek-bot-egress
    user: "13:13"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /var/run/squid:rw,noexec,nosuid,nodev,size=1m,uid=13,gid=13,mode=0700
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=1m,uid=13,gid=13,mode=0700
      - /var/log/squid:rw,noexec,nosuid,nodev,size=1m,uid=13,gid=13,mode=0700
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 50
    networks:
      botnet:
        ipv4_address: 172.30.0.2
      egress_net: {}

  bot:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    image: discord-deepseek-bot:local
    container_name: discord-deepseek-bot
    depends_on:
      - egress
      - fetcher
      - tools
    # Secrets + settings come only from .env (passed as environment variables;
    # the .env file itself is NOT mounted and is excluded from the image by .dockerignore).
    env_file:
      - .env
    environment:
      <<: *proxy-env
      DATA_DIR: /data
      # Read-only model tools (design-v3 §10). Plain http on botnet: no auth, the network
      # isolation is the boundary. Public guilds never get a tool list, so never call this.
      TOOLS_MCP_URL: http://172.30.0.21:8090/mcp
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    # v3: per-guild configs (rw, /setup writes here) + the shared persona/news library (ro).
    volumes:
      - type: bind
        source: ./data/guilds
        target: /data/guilds
        read_only: false
        bind:
          create_host_path: true
      - type: bind
        source: ./data/shared
        target: /data/shared
        read_only: true
        bind:
          create_host_path: true
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks:
      botnet:
        ipv4_address: 172.30.0.10
    extra_hosts: *no-host-names

  # Nightly recap (22:00) + morning topics (09:00). Same image and hardening as the bot.
  scheduler:
    <<: *hardening
    image: discord-deepseek-bot:local
    pull_policy: never
    container_name: discord-deepseek-bot-scheduler
    entrypoint: ["python", "/opt/app/scheduler.py"]
    depends_on:
      - egress
      - fetcher
      - bot
    env_file:
      - .env
    environment:
      <<: *proxy-env
      DATA_DIR: /data
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    # Per-guild configs, profile blocks, material and the last 10 recaps (design-v3 §1).
    # Whole ./data so the scheduler can also read data/shared/personas; nothing else is mounted.
    volumes:
      - type: bind
        source: ./data
        target: /data
        read_only: false
        bind:
          create_host_path: true
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 50
    networks:
      botnet:
        ipv4_address: 172.30.0.11
    extra_hosts: *no-host-names

  # Keyless fetcher: web pages, RSS, file parsing. NO env_file: it must never see a secret
  # (fetcher.py also refuses to start if one is present).
  fetcher:
    <<: *hardening
    image: discord-deepseek-bot:local
    pull_policy: never
    container_name: discord-deepseek-bot-fetcher
    entrypoint: ["python", "/opt/app/fetcher.py"]
    depends_on:
      - egress
    environment:
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      http_proxy: http://egress:3128
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 50
    networks:
      botnet:
        ipv4_address: 172.30.0.20
    extra_hosts: *no-host-names

  # Keyless MCP tools server: search / read_page / read_video, streamable HTTP on /mcp.
  # NO env_file and no mounts: it must never see a secret (server.py refuses to start if
  # one is present) and it cannot read guild configs — trust level and quota are checked in
  # the bot, the guild id and domain allow-list again here. Merged from docker-compose.tools.yml.
  tools:
    <<: *hardening
    build:
      context: ./tools
      dockerfile: Dockerfile
    image: ddb-tools:local
    container_name: discord-deepseek-bot-tools
    depends_on:
      - egress
      - searxng
    environment:
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      http_proxy: http://egress:3128
      # SearXNG is on botnet: it must NOT go through the egress proxy.
      NO_PROXY: searxng
      no_proxy: searxng
      SEARXNG_URL: http://searxng:8080
    user: "10001:10001"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 50
    networks:
      botnet:
        ipv4_address: 172.30.0.21
    extra_hosts: *no-host-names

  # Keyless SearXNG, used only by `tools` through the JSON API. Its one secret is the
  # cookie-signing key: searxng/settings.yml keeps the REPLACE_ME_AT_DEPLOY placeholder and
  # SearXNG's own settings loader overrides server.secret_key from SEARXNG_SECRET, read here
  # from searxng.env (that one variable only, never committed). No other env_file, and the
  # proxy is configured in searxng/settings.yml (outgoing.proxies).
  searxng:
    <<: *hardening
    # Pinned by digest = the 2026.11.13-219b63b20 build (same tag scheme as the egress image).
    image: searxng/searxng@sha256:048e613ce4a7ddc35dfb05a0b8ede795a054187b3c3b89518adc37d5e03a8297
    container_name: discord-deepseek-bot-searxng
    depends_on:
      - egress
    env_file:
      - searxng.env
    environment:
      GRANIAN_HOST: 0.0.0.0
      GRANIAN_PORT: "8080"
    # uid/gid 977 = "searxng" in the upstream image.
    user: "977:977"
    # The only mount: settings, read-only. The image's own /etc/searxng/settings.yml is replaced.
    volumes:
      - type: bind
        source: ./searxng/settings.yml
        target: /etc/searxng/settings.yml
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/cache/searxng:rw,noexec,nosuid,nodev,size=16m,uid=977,gid=977,mode=0700
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 100
    networks:
      botnet:
        ipv4_address: 172.30.0.22
    extra_hosts: *no-host-names

networks:
  botnet:
    driver: bridge
    internal: true
    driver_opts:
      # Docker Engine >= 28: give the bridge no host-side IP, so containers cannot reach
      # services on the host through the network gateway (internal: true alone still allows that).
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
  egress_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
